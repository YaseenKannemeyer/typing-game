A.authStatus=(state,{email='you@example.com',guest=A.sampleGuest}={})=>{const variants={verify:{label:'ONE MORE STEP',title:'Check your inbox.',body:`Confirm the link sent to ${email}. Your guest progress is still attached to your current identity while you verify.`,button:'Simulate email verification',action:'verify'},saving:{label:'PRESERVING YOUR PROGRESS',title:'Keeping your story together.',body:'Waiting for the server to confirm the account link and ownership of your race history.',button:'Preservation in progress',action:''},saved:{label:'ACCOUNT LINK CONFIRMED',title:'All yours. Every finish.',body:`Your ${guest.races} races, ${guest.trophies} trophies, and customized ride are linked to your account in this simulated success state.`,button:'View your profile',action:'profile'},recovery:{label:'RECOVERY REQUESTED',title:'Check your email.',body:'If an account exists for that address, you’ll receive recovery instructions. This preview has not sent an email.',button:'Back to sign in',action:'signin'},retry:{label:'WE COULDN’T CONFIRM THE LINK',title:'Your guest session stays put.',body:'Account preservation has not been confirmed. Keep this session open and retry. Do not clear the guest identity or show a saved state yet.',button:'Retry preservation',action:'retry'}};const s=variants[state]||variants.verify;return `<section class="a-auth-status"><div class="a-status-art">${state==='saved'?TrophyKit.renderTrophy('participation',{size:120}):A.preserveArt()}</div><div class="g-eyebrow">${s.label}</div><h1 class="g-title">${s.title}</h1><p>${E(s.body)}</p><div class="a-preserve-receipt"><span>${G.icon('user',18)} ${E(guest.name)}</span><span>${E(guest.races)} races</span><span>${E(guest.trophies)} trophies</span></div>${G.button(s.button,{icon:'arrow',loading:state==='saving',attrs:`data-action="${s.action}"`})}${state==='verify'?'<button class="a-text-button" data-action="resend">Resend confirmation</button>':''}<p class="a-demo-label">SIMULATED UI STATE · NOT A REAL ACCOUNT OPERATION</p></section>`};
A.mergeReview=(guest=A.sampleGuest)=>`<section class="a-merge-review"><div class="g-eyebrow">REVIEW BEFORE YOU LINK</div><h1 class="g-title">One racer. Two histories.</h1><p class="g-muted">After signing in to an existing account, review what the server can safely attach. Keep the guest session until the operation succeeds.</p><div class="g-grid-2"><div class="g-panel"><span class="g-pill">CURRENT GUEST</span><h2>${E(guest.name)}</h2><p>${guest.races} verified races · ${guest.trophies} trophies</p><div style="max-width:220px">${VehicleKit.svg(guest.vehicle)}</div></div><div class="g-panel"><span class="g-pill g-pill--lime">EXISTING ACCOUNT · DEMO</span><h2>Yaseen</h2><p>24 verified races · 9 distinct trophies</p><p class="g-small g-muted">Final totals must be recalculated after duplicate records and ownership are checked.</p></div></div><div class="a-merge-note">${G.icon('check')}<span>Existing results remain intact. No replacement or deletion is implied by this preview.</span></div><div class="g-row">${G.button('Confirm & preserve history',{icon:'arrow',attrs:'data-action="confirm-merge"'})}${G.button('Cancel and keep guest session',{variant:'secondary',attrs:'data-action="cancel-merge"'})}</div><p class="a-demo-label">DEMO REVIEW · REQUIRES A SERVER-VERIFIED LINK/MERGE TRANSACTION</p></section>`;
})(globalThis);

</script><script>

A.demoSessions=[['2026-09-15',74.2,94.8,'hard'],['2026-09-18',78.5,95.3,'coding'],['2026-09-21',82.1,95.1,'medium'],['2026-09-24',86.8,96.4,'coding'],['2026-09-27',88.4,96.9,'easy'],['2026-09-30',91.6,97.2,'hard'],['2026-10-02',96.5,97.9,'shakespeare'],['2026-10-04',101.2,97.4,'medium'],['2026-10-06',99.8,98.2,'easy'],['2026-10-08',104.2,98.8,'medium'],['2026-10-09',108.6,98.5,'easy'],['2026-10-10',112.4,99.1,'easy']].map(([date,wpm,accuracy,mode])=>({date,wpm,accuracy,mode}));

A.avatar=(name,size=88)=>{const initials=String(name).trim().split(/\s+/).slice(0,2).map(n=>Array.from(n)[0]||'').join('').toUpperCase();return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="${G.clamp(size,24,300)}" height="${G.clamp(size,24,300)}" role="img" aria-label="${E(name)} avatar"><rect x="2" y="2" width="96" height="96" rx="26" fill="#b9f46a"/><path d="M0 82L80 0H100V30L30 100H0Z" fill="#91bd55" opacity=".7"/><text x="50" y="63" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#21351f">${E(initials)}</text></svg>`};
A.profileHeader=(p=A.sampleProfile,{avatar=false}={})=>`<section class="a-profile-header"><div class="a-profile-art">${avatar?A.avatar(p.name,124):VehicleKit.svg({...p.vehicle,animation:'idle'})}</div><div class="a-profile-identity"><span class="g-eyebrow">YOUR DRIVER PROFILE</span><h1>${E(p.name)}</h1><p>@${E(p.handle)} <span>·</span> Member since ${E(p.memberSince)}</p><div class="g-row"><span class="g-pill g-pill--lime">ACCOUNT LINKED</span><button class="a-text-button" data-action="edit-profile">Edit display name</button></div></div><div class="a-profile-metrics">${[['BEST WPM',p.bestWpm],['RACES',p.races],['WINS',p.wins],['TROPHIES',p.trophies]].map(([n,v])=>`<div><strong>${v==null?'—':E(v)}</strong><span>${n}</span></div>`).join('')}</div></section>`;
A.chartCard=(title,kicker,html)=>`<section class="a-chart-card"><div class="a-card-heading"><h2>${title}</h2><span>${kicker}</span></div>${html}</section>`;
A.profileCharts=({days=30,sessions=A.demoSessions}={})=>{const anchor=Date.parse('2026-10-10T23:59:59Z'),filtered=sessions.filter(s=>days===0||Date.parse(s.date)>=anchor-days*86400000);const modes=['easy','medium','hard','coding','shakespeare'];const bests=modes.map(m=>({mode:m[0].toUpperCase()+m.slice(1),wpm:filtered.some(s=>s.mode===m)?Math.max(...filtered.filter(s=>s.mode===m).map(s=>s.wpm)):null}));return `<div class="g-grid-2">${A.chartCard('WPM over time','VERIFIED RACES',A.lineChart({data:filtered.map(s=>({date:s.date,value:s.wpm}))}))}${A.chartCard('Accuracy trend','CORRECT / ALL ATTEMPTS',A.lineChart({data:filtered.map(s=>({date:s.date,value:s.accuracy})),metric:'accuracy'}))}</div><div class="g-grid-2 a-section">${A.chartCard('Your best, by mode','SELECTED PERIOD',A.modeBests(bests))}<section class="a-chart-card"><div class="a-card-heading"><h2>Recent trophies</h2><span>YOUR COLLECTION</span></div><div class="a-trophy-strip">${['comeback-kid','consistency','unstoppable'].map(id=>{const t=TrophyKit.catalog.find(x=>x.id===id);return `<div>${TrophyKit.renderTrophy(id,{size:92})}<strong>${E(t.name)}</strong><span>${id==='unstoppable'?'Progression':'Race award'}</span></div>`}).join('')}</div><p class="a-footnote">Headline trophy total counts distinct trophy types earned. Repeated awards remain in your race history.</p></section></div>`};
A.leaderRows=[['Nova',132.4,'hypercar','#c6a3ff'],['Mika',128.9,'formula','#9fcaff'],['Kai',124.6,'drift','#70e3c6'],['Aisha',121.2,'rally','#f7d48e'],['Sam',119.8,'muscle','#ffa69b'],['Alex',116.3,'classic','#b9f46a'],['Yaseen',112.4,'supercar','#ff683b'],['Robin',108.1,'vintage','#d3b9ff']].map(([name,wpm,model,primary],i)=>({id:'leader-'+i,name,wpm,accuracy:Number((99.6-i*.1).toFixed(1)),date:'2026-10-'+String(10-i).padStart(2,'0'),vehicle:{model,primary,number:i+1},you:name==='Yaseen'}));
A.hallOfFame=rows=>`<section class="a-hall"><div class="a-hall-label"><span class="g-eyebrow">THE HALL OF FAME</span><h1>Fast hands.<br>Lasting names.</h1><p>The fastest verified finishes in this view.</p></div><div class="a-champions">${[1,0,2].filter(i=>rows[i]).map(i=>{const p=rows[i];return `<article class="a-champion rank-${i+1}"><div class="a-champion-medal">${TrophyKit.renderTrophy(['gold-champion','silver-runner-up','bronze-racer'][i],{size:74})}</div><span class="a-champion-rank">${String(i+1).padStart(2,'0')}</span><div class="a-champion-car">${VehicleKit.svg(p.vehicle)}</div><h2>${E(p.name)}</h2><strong>${p.wpm.toFixed(1)} <small>WPM</small></strong><p>${p.accuracy.toFixed(1)}% accuracy</p></article>`}).join('')}</div></section>`;
A.leaderTable=rows=>`<div class="a-leader-table"><table><caption class="g-sr">Leaderboard by highest verified race WPM</caption><thead><tr><th scope="col">Rank</th><th scope="col">Racer</th><th scope="col">Best WPM</th><th scope="col">Accuracy of best race</th><th scope="col">Date</th></tr></thead><tbody>${rows.map((p,i)=>`<tr class="${p.you?'is-you':''}"><td>${String(i+1).padStart(2,'0')}</td><th scope="row"><span>${E(p.name)} ${p.you?'<small>YOU</small>':''}</span></th><td>${p.wpm.toFixed(1)}</td><td>${p.accuracy.toFixed(1)}%</td><td>${E(p.date)}</td></tr>`).join('')}</tbody></table></div>`;
A.achievementToast=({trophyId='unstoppable',statistic='3 consecutive race completions',eventId='demo-award',recipient='Yaseen'}={})=>{const trophy=TrophyKit.catalog.find(t=>t.id===trophyId);if(!trophy)throw Error('Unknown trophy');return `<article class="a-achievement-toast" data-event-id="${E(eventId)}"><div class="a-unlock-art">${TrophyKit.renderTrophy(trophyId,{size:86,state:'reveal'})}</div><div class="a-unlock-copy"><span class="g-eyebrow">TROPHY UNLOCKED</span><h2>${E(trophy.name)}</h2><p>${E(statistic)}</p><span class="a-unlock-recipient">${E(recipient)} · Saved to your collection</span></div><button class="a-toast-dismiss" aria-label="Dismiss trophy notification">${G.icon('close',18)}</button></article>`};
class AchievementQueue{constructor(region){this.region=region;this.queue=[];this.seen=new Set;this.active=null;this.timer=null;this.remaining=6500;this.onClick=e=>{if(e.target.closest('.a-toast-dismiss'))this.next()};this.pause=()=>{if(this.timer){clearTimeout(this.timer);this.timer=null;this.remaining=Math.max(0,this.remaining-(performance.now()-this.started))}};this.resume=()=>{if(!this.active||this.timer||document.hidden||this.region.matches(':hover')||this.region.contains(document.activeElement))return;this.started=performance.now();this.timer=setTimeout(()=>this.next(),this.remaining)};this.visibility=()=>document.hidden?this.pause():this.resume();this.onFocusOut=()=>{clearTimeout(this.focusTimer);this.focusTimer=setTimeout(this.resume,0)};region.addEventListener('click',this.onClick);region.addEventListener('pointerenter',this.pause);region.addEventListener('pointerleave',this.resume);region.addEventListener('focusin',this.pause);region.addEventListener('focusout',this.onFocusOut);document.addEventListener('visibilitychange',this.visibility);}
push(event){if(!event.eventId||this.seen.has(event.eventId))return false;if(!TrophyKit.catalog.some(t=>t.id===event.trophyId))return false;this.seen.add(event.eventId);this.queue.push(event);if(!this.active)this.next();return true}
next(){clearTimeout(this.timer);this.timer=null;this.region.replaceChildren();this.active=this.queue.shift();if(!this.active)return;this.region.innerHTML=A.achievementToast(this.active);this.remaining=6500;this.resume()}
destroy(){clearTimeout(this.timer);clearTimeout(this.focusTimer);this.queue=[];this.active=null;this.region.replaceChildren();this.region.removeEventListener('click',this.onClick);this.region.removeEventListener('pointerenter',this.pause);this.region.removeEventListener('pointerleave',this.resume);this.region.removeEventListener('focusin',this.pause);this.region.removeEventListener('focusout',this.onFocusOut);document.removeEventListener('visibilitychange',this.visibility)}}
A.AchievementQueue=AchievementQueue;
})(globalThis);

</script><script>
'use strict';
const A=AccountKit,G=GridKit,$=id=>document.getElementById(id);
let profile={...A.sampleProfile},authMode='save',avatar=false,days=30,awaitingMerge=false,activeGuest={...A.sampleGuest},pendingEmail='you@example.com',timers=[],period=30,mode='all',currentRoute='save';
const queue=new A.AchievementQueue($('achievements'));
function defer(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t}
function formBindings(){const button=$('auth-submit');if(button)button.type='submit'}
function authView(){return A.authScreen({mode:authMode,guest:activeGuest})+`<div class="a-states-bar" aria-label="Preview alternate account states">${G.button('Verification state',{variant:'secondary',attrs:'data-state="verify"'})}${G.button('Preservation error',{variant:'secondary',attrs:'data-state="retry"'})}${G.button('Existing-account review',{variant:'secondary',attrs:'data-state="merge"'})}</div>`}
function profileView(){return A.profileHeader(profile,{avatar})+`<div class="a-profile-toolbar"><h2>Your racing story</h2><div class="g-row"><button class="g-btn g-btn--ghost" data-action="avatar" style="min-height:36px;font-size:10px">${avatar?'Show garage car':'Show avatar'}</button><div class="a-period">${[[7,'7 days'],[30,'30 days'],[0,'All time']].map(([n,label])=>`<button class="g-filter" data-period="${n}" aria-pressed="${days===n}">${label}</button>`).join('')}</div></div></div><div id="profile-charts">${A.profileCharts({days})}</div><p class="a-footnote">Illustrative account data as of 10 October 2026. Best WPM is a completed-race average, not a rolling peak. Accuracy is correct attempts / all attempts. Charts exclude unfinished and unverified races.</p><div class="a-states-bar">${G.button('Preview empty charts',{variant:'secondary',attrs:'data-action="empty-charts"'})}${G.button('Preview data error',{variant:'secondary',attrs:'data-action="chart-error"'})}${G.button('Restore sample data',{variant:'secondary',attrs:'data-action="restore-charts"'})}</div><dialog class="a-edit-dialog" id="edit-profile"><form method="dialog" id="edit-profile-form"><h2>Your racing name</h2><label class="g-field">Display name<input id="profile-name" class="g-input" value="${G.escape(profile.name)}" required maxlength="24" autocomplete="nickname"></label><p class="g-muted g-small">Changes affect this preview only.</p><div class="g-row"><button class="g-btn g-btn--primary" type="submit" value="save">Save name</button><button class="g-btn g-btn--secondary" type="button" data-action="cancel-edit">Cancel</button></div></form></dialog>`}
const scores={easy:[132.4,128.9,124.6,121.2,119.8,116.3,112.4,108.1],medium:[122.3,117.6,114.8,113.6,108.6,110.2,104.2,101.8],hard:[103.4,108.3,104.1,100.5,98.6,93.2,91.6,90.1],coding:[99.5,94.8,101.3,92.6,88.9,86.4,86.8,81.2],shakespeare:[118.3,109.8,105.2,104.3,101.8,98.2,96.5,93.1]};
function filteredLeaders(){const anchor=Date.parse('2026-10-10T23:59:59Z');return A.leaderRows.map((p,i)=>({...p,wpm:mode==='all'?p.wpm:scores[mode][i]})).filter(p=>period===0||Date.parse(p.date)>=anchor-period*86400000).sort((a,b)=>b.wpm-a.wpm||b.accuracy-a.accuracy||a.id.localeCompare(b.id))}
function leaderboardView(){const rows=filteredLeaders();return A.hallOfFame(rows)+`<div class="a-leader-controls"><div><h2 style="margin:0;font-size:22px">The full field</h2><p class="a-footnote">Ranked by best verified race WPM · ${period===0?'All time':period+' days'} · ${mode==='all'?'All modes':mode}</p></div><div class="g-row"><label class="g-sr" for="leader-mode">Leaderboard mode</label><select id="leader-mode" class="g-select">${['all','easy','medium','hard','coding','shakespeare'].map(m=>`<option value="${m}" ${m===mode?'selected':''}>${m==='all'?'All modes':m[0].toUpperCase()+m.slice(1)}</option>`).join('')}</select><label class="g-sr" for="leader-period">Leaderboard period</label><select id="leader-period" class="g-select">${[[7,'7 days'],[30,'30 days'],[0,'All time']].map(([n,label])=>`<option value="${n}" ${n===period?'selected':''}>${label}</option>`).join('')}</select></div></div>${A.leaderTable(rows)}<p class="a-footnote">This hall of fame is a profile leaderboard, not the finishing order of a live race. A production server must define eligibility, ties, period boundaries, and accuracy for the selected best race.</p>`}

function render(){timers.forEach(clearTimeout);timers=[];currentRoute=location.hash.slice(1)||'save';if(['save','signup','signin','reset'].includes(currentRoute)){authMode=currentRoute;$('content').innerHTML=authView();formBindings()}else if(currentRoute==='profile')$('content').innerHTML=profileView();else if(currentRoute==='leaderboard')$('content').innerHTML=leaderboardView();else if(currentRoute==='achievements')$('content').innerHTML=achievementView();else{location.hash='save';return}document.querySelectorAll('.a-nav a').forEach(a=>{const selected=a.hash==='#'+currentRoute||(a.hash==='#save'&&['signup','signin','reset'].includes(currentRoute));if(selected)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});window.scrollTo({top:0,behavior:'instant'});}
function status(state){$('content').innerHTML=state==='merge'?A.mergeReview(activeGuest):A.authStatus(state,{email:pendingEmail,guest:activeGuest});}
function preserve(){status('saving');defer(()=>status('saved'),1200)}
document.addEventListener('submit',event=>{if(event.target.id==='account-form'){event.preventDefault();const form=event.target,error=$('auth-error'),email=form.elements.email.value.trim(),password=form.elements.password?.value||'',name=form.elements.displayName?.value.trim();let message='';if(name!==undefined&&!name)message='Choose a display name.';else if(!email||!form.elements.email.validity.valid)message='Enter a valid email address.';else if(authMode!=='reset'&&!password)message='Enter your password.';else if(['save','signup'].includes(authMode)&&password.length<8)message='Use at least 8 characters for this preview.';if(message){error.hidden=false;error.textContent=message;error.tabIndex=-1;error.focus();return}pendingEmail=email;const submit=$('auth-submit');submit.disabled=true;submit.setAttribute('aria-busy','true');submit.textContent='Checking…';defer(()=>{if(authMode==='reset'){status('recovery')}else if(authMode==='signin'){if(awaitingMerge)status('merge');else location.hash='profile'}else{if(authMode==='signup')activeGuest={...A.sampleGuest,name:name||'Racer',races:0,wins:0,trophies:0};else activeGuest={...activeGuest,name:name||activeGuest.name};status('verify')}},500)}else if(event.target.id==='edit-profile-form'){event.preventDefault();const name=$('profile-name').value.trim();if(!name){$('profile-name').setCustomValidity('Enter a display name.');$('profile-name').reportValidity();return}profile.name=name;$('edit-profile').close();render();document.querySelector('[data-action="edit-profile"]')?.focus();}});
document.addEventListener('input',event=>{if(event.target.id==='profile-name')event.target.setCustomValidity('')});
document.addEventListener('click',event=>{const link=event.target.closest('.a-nav a');if(link&&link.hash===location.hash){event.preventDefault();render();return}const b=event.target.closest('button');if(!b)return;if(b.dataset.auth){awaitingMerge=false;location.hash=b.dataset.auth;if(currentRoute===b.dataset.auth)render();return}if(b.dataset.state){status(b.dataset.state);return}if(b.dataset.period!==undefined){days=Number(b.dataset.period);render();return}switch(b.dataset.action){case'toggle-password':{const input=$('auth-password'),show=input.type==='password';input.type=show?'text':'password';b.textContent=show?'Hide':'Show';b.setAttribute('aria-label',show?'Hide password':'Show password');b.setAttribute('aria-pressed',String(show));break}case'existing-account':awaitingMerge=true;location.hash='signin';break;case'guest':G.toast('Guest session retained in this preview. No account was created.');break;case'verify':case'retry':preserve();break;case'confirm-merge':awaitingMerge=false;status('saving');defer(()=>{$('content').innerHTML=`<section class="a-auth-status">${A.preserveArt()}<div class="g-eyebrow">SIMULATED SERVER CONFIRMATION</div><h1 class="g-title">History linked.</h1><p>The review is complete. Production totals must be fetched from the server after deduplication; this preview does not add the two account totals.</p>${G.button('Return to profile',{attrs:'data-action="profile"'})}</section>`},1000);break;case'cancel-merge':awaitingMerge=false;activeGuest={...A.sampleGuest};location.hash='save';if(currentRoute==='save')render();break;case'profile':location.hash='profile';break;case'signin':location.hash='signin';if(currentRoute==='signin')render();break;case'resend':b.disabled=true;G.toast('Demo only: no email sent. Try again after the cooldown.');defer(()=>{b.disabled=false},10000);break;case'avatar':avatar=!avatar;render();break;case'edit-profile':$('edit-profile').showModal();break;case'cancel-edit':$('edit-profile').close();break;case'empty-charts':$('profile-charts').innerHTML=`<div class="g-grid-2">${A.chartCard('WPM over time','NO RACES YET',A.lineChart({data:[]}))}${A.chartCard('Accuracy trend','NO RACES YET',A.lineChart({data:[],metric:'accuracy'}))}</div>`;break;case'chart-error':$('profile-charts').innerHTML=G.banner('We couldn’t load your statistics. Your saved race history has not been changed. Retry when your connection returns.','warning');break;case'restore-charts':$('profile-charts').innerHTML=A.profileCharts({days});break;case'unlock':queue.push({trophyId:'unstoppable',statistic:'3 consecutive race completions',recipient:profile.name,eventId:'session-demo-unstoppable'});break;case'queue':[['unstoppable','3 consecutive race completions'],['comeback-kid','Gained 7 positions'],['perfectionist','100% accuracy · 0 mistakes']].forEach(([id,statistic])=>queue.push({trophyId:id,statistic,recipient:profile.name,eventId:'session-demo-'+id}));break;case'reset-awards':queue.destroy();queue.seen.clear();location.reload();break;}});
document.addEventListener('change',event=>{if(event.target.id==='leader-mode'){mode=event.target.value;render()}if(event.target.id==='leader-period'){period=Number(event.target.value);render()}});
$('brand').innerHTML=G.wordmark();window.addEventListener('hashchange',render);window.addEventListener('beforeunload',()=>{timers.forEach(clearTimeout);queue.destroy()});render();

</script></body></html>
