function toast(message){const e=$('toast');e.textContent=message;e.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.hidden=true,4200)}
function footer(){return '<footer class="footer">GRID / RACE EXPERIENCE EXPANSION · EXAMPLE DATA · NO NETWORK OR OFFICIAL SCORING</footer>'}
function overview(){return K.heading('25+ / 26–29','RACE EXPERIENCE','Make every lap count.','A better first race. A clearer broadcast. A reason to come back.')+`<section class="overview-hero"><div><span class="eyebrow">GRID MOTOR CLUB / EXPERIENCE PACK</span><h2>Built for the room.<br><em>Made for the racer.</em></h2><p>Five coordinated kits for your presentation, practice sessions and race weekends.</p><div class="actions"><a class="x-btn primary" href="#spectator">Open spectator view ${K.icon('arrow')}</a><a class="x-btn secondary" href="#comfort">Try your first lap</a></div></div><div class="overview-car">${K.car('formula','#b9f46a',26)}</div></section><div class="kit-cards">${[['26','Spectator & presentation','All fifteen standings, a featured racer, projector mode and winner reveal.','spectator','eye'],['27','Debrief & coaching','Readable timelines, difficult words and a useful next practice action.','debrief','chart'],['28','First race & comfort','An actual typing tutorial, correction guidance and device preferences.','comfort','keys'],['29','Ghost & challenges','Race a saved progress trace and practise a focused drill.','ghost','ghost'],['25+','Championship host','Configure rounds, handle reconnects and accept results exactly once.','host','flag']].map(([n,title,desc,id,icon])=>`<a class="kit-card" href="#${id}"><div>${K.icon(icon,30)}<small>KIT ${n}</small></div><h3>${title}</h3><p>${desc}</p></a>`).join('')}<article class="kit-card"><div>${K.icon('check',30)}<small>CLAUDE HANDOFF</small></div><h3>Ready to integrate.</h3><p>Reusable renderers, typed data contracts and an integration guide for your existing React game.</p><a href="README-FOR-CLAUDE.md">Read the integration guide</a></article></div>`}
const pages={overview,spectator:()=>K.heading('26','SPECTATOR & PRESENTATION','Bring the whole room along.','A calm broadcast layout with every racer visible in the standings.')+`<div class="preview-toolbar">${K.button(K.icon('play')+'Play sample race','play-race')}${K.button('Reset','reset-race','secondary')}${K.button(K.icon('expand')+'Presentation layout','presentation','secondary')}${K.button('Browser fullscreen','fullscreen','quiet')}${K.button('Winner reveal','winner','quiet')}${K.button(connection==='live'?'Preview delayed feed':'Restore feed','connection','quiet')}</div><div id="spectator-live">${K.spectator({racers:spectatorRacers,featured,phase,connection,time:raceElapsed})}</div>`,debrief:()=>K.heading('27','RACE DEBRIEF & COACHING','A little insight. A better next lap.','Understand a completed race without turning the result screen into homework.')+`<div class="preview-toolbar">${K.button(missingTimeline?'Restore sample timeline':'Preview missing timeline','timeline-data','quiet')}</div><div id="debrief-live">${K.debrief({metric,missing:missingTimeline})}</div>`,comfort:()=>K.heading('28','FIRST RACE & TYPING COMFORT','Get comfortable. Then get going.','Try the correction flow before entering a multiplayer race.')+K.tutorial(tutorial,prefs),ghost:()=>K.heading('29','PERSONAL GHOST & PRACTICE','Race the person you were.','Private practice with a recorded lap, focused drills and simple milestones.')+K.ghostPage({missing:missingGhost,drill:isDrill,passage:ghostPassage}),host:()=>K.heading('25+','CHAMPIONSHIP HOST EXTENSION','One event. A clear next step.','Extends the existing championship kit with a host workflow and recovery states.')+K.hostPage(host)};
function currentPage(){const id=location.hash.slice(1);return pages[id]?id:'overview'}
function stopLoops(){clearInterval(spectatorTimer);spectatorTimer=null;cancelAnimationFrame(ghostFrame);ghostFrame=null;ghostStart=null;ghostDone=false}
function render({focusAction}={}){stopLoops();const id=currentPage();if(id!=='spectator')document.body.classList.remove('presentation');$('content').innerHTML=pages[id]()+footer();document.querySelectorAll('.nav a').forEach(a=>{if(a.hash==='#'+id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.title='GRID / '+sections.find(s=>s[0]===id)[2];applyPreferences();if(id==='ghost'&&isDrill)$('ghost-input')?.focus({preventScroll:true});if(focusAction){const target=document.querySelector(`[data-action="${focusAction}"]`);target?.focus({preventScroll:true})}window.scrollTo({top:0,behavior:'instant'})}
function repaintBroadcast(){const focused=document.activeElement?.dataset?.feature;$('spectator-live').innerHTML=K.spectator({racers:spectatorRacers,featured,phase,connection,time:raceElapsed});if(focused)document.querySelector(`[data-feature="${focused}"]`)?.focus({preventScroll:true})}
function updateTutorial(){const field=$('tutorial-input');if(!field)return;field.value=tutorial.typed;field.setSelectionRange(field.value.length,field.value.length);$('tutorial-passage').innerHTML=K.passageMarkup(tutorial);$('tutorial-stats').innerHTML=K.typingStats(tutorial);const wrong=tutorial.typed!==tutorial.passage.slice(0,tutorial.typed.length);$('correction-hint').textContent=tutorial.finished?'Lap complete. You are ready to join a race.':wrong?'Incorrect character. Press Backspace, then try again.':'Keep going. Corrected mistakes remain in your attempt count.';field.setAttribute('aria-invalid',String(wrong));document.querySelectorAll('.steps li').forEach((e,i)=>e.classList.toggle('current',i===(tutorial.finished?2:tutorial.started?1:0)));if(tutorial.finished){$('typing-status').textContent='Tutorial complete. '+tutorial.mistakes+' mistakes, '+K.fmt(tutorial.correct/tutorial.attempts*100)+'% accuracy.';field.readOnly=true}}
function applyInput(text){for(const c of Array.from(text||''))tutorial=K.typeAttempt(tutorial,c);updateTutorial()}
function resetGhost(){cancelAnimationFrame(ghostFrame);ghostFrame=null;ghostStart=null;ghostDone=false;const input=$('ghost-input');if(input)input.value='';for(const id of ['you-car','ghost-car']){const car=$(id);if(car){car.style.left='0%';car.style.transform='translateX(0%)'}}for(const id of ['start','half','finish'])$('milestone-'+id)?.classList.remove('complete');if($('ghost-status'))$('ghost-status').textContent=missingGhost?'No recording. Choose a focused drill.':'Ready. The clock starts on your first character.'}
function moveCar(id,progress){const el=$(id);if(el){el.style.left=(progress*100)+'%';el.style.transform=`translateX(-${progress*100}%)`}}
function correctPrefix(value,passage){let n=0;while(n<value.length&&n<passage.length&&value[n]===passage[n])n++;return n/passage.length}
let lastGhostPaint=0;
function ghostTick(){if(ghostStart===null||ghostDone)return;const elapsed=(performance.now()-ghostStart)/1000;const g=K.ghostAt(K.ghostSamples,elapsed);if(!missingGhost&&performance.now()-lastGhostPaint>(reduced()?300:80)){moveCar('ghost-car',g);lastGhostPaint=performance.now()}ghostFrame=requestAnimationFrame(ghostTick)}
document.addEventListener('beforeinput',e=>{if(e.target.id!=='tutorial-input'||e.isComposing)return;if(e.inputType==='insertText'&&e.data){e.preventDefault();applyInput(e.data)}else if(e.inputType==='deleteContentBackward'){e.preventDefault();tutorial=K.typeAttempt(tutorial,'Backspace');updateTutorial()}else if(!e.inputType.includes('Composition'))e.preventDefault()});
document.addEventListener('compositionend',e=>{if(e.target.id==='tutorial-input'){applyInput(e.data);e.target.value=tutorial.typed}});
document.addEventListener('paste',e=>{if(['tutorial-input','ghost-input'].includes(e.target.id)){e.preventDefault();toast('Type the passage to practise. Pasting is disabled in this demo.')}});
document.addEventListener('input',e=>{const target=e.target;if(target.id==='tutorial-input'&&!e.isComposing&&target.value!==tutorial.typed){const previous=tutorial.typed;const next=target.value;if(next===previous.slice(0,-1))tutorial=K.typeAttempt(tutorial,'Backspace');else if(next.startsWith(previous)&&Array.from(next.slice(previous.length)).length===1)tutorial=K.typeAttempt(tutorial,next.slice(previous.length));updateTutorial()}if(target.id==='text-size'){prefs.size=Number(target.value);$('size-output').textContent=prefs.size+'px';$('tutorial-passage').style.fontSize=prefs.size+'px';applyPreferences()}if(target.id==='contrast-toggle'){prefs.contrast=target.checked;applyPreferences()}if(target.id==='motion-toggle'){prefs.motion=target.checked;applyPreferences()}if(target.dataset.round!==undefined&&host.phase==='setup')host.rounds[Number(target.dataset.round)].mode=target.value;
if(target.id==='ghost-input'&&!ghostDone){if(ghostStart===null&&target.value.length){ghostStart=performance.now();$('milestone-start').classList.add('complete');ghostTick()}const progress=correctPrefix(target.value,ghostPassage);moveCar('you-car',progress);$('milestone-half').classList.toggle('complete',progress>=.5);const correct=ghostPassage.startsWith(target.value);target.setAttribute('aria-invalid',String(!correct));if(progress===1&&target.value===ghostPassage){ghostDone=true;cancelAnimationFrame(ghostFrame);$('milestone-finish').classList.add('complete');const elapsed=(performance.now()-ghostStart)/1000;target.readOnly=true;$('ghost-status').textContent='Practice complete in '+K.fmt(elapsed)+'s. '+(missingGhost?'Focused drill finished.':elapsed<27?'You finished before the example ghost.':'You completed your lap. Keep practising.')}else $('ghost-status').textContent=correct?'Keep your rhythm. '+Math.round(progress*100)+'% complete.':'Correct the first mismatched character to advance.'}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.feature){featured=b.dataset.feature;repaintBroadcast();return}if(b.dataset.metric){metric=b.dataset.metric;$('debrief-live').innerHTML=K.debrief({metric,missing:missingTimeline});document.querySelector(`[data-metric="${metric}"]`)?.focus();return}if(b.dataset.drill){ghostPassage=K.drills[b.dataset.drill];missingGhost=true;isDrill=true;render();$('ghost-input').disabled=false;$('ghost-input').focus();$('ghost-status').textContent='Focused drill. No ghost is loaded for this passage.';return}const action=b.dataset.action;if(action?.startsWith('host-')&&action!=='host-reset'){host=K.hostTransition(host,action.slice(5));render();document.querySelector('.panel .actions button:not(:disabled)')?.focus({preventScroll:true});return}switch(action){case'host-reset':host=K.newEvent();render();break;case'practice-words':ghostPassage=K.drills.precision;missingGhost=true;isDrill=true;location.hash='ghost';break;case'reset-tutorial':tutorial=K.newTyping();render();$('tutorial-input').focus();break;case'tutorial-lobby':toast('Tutorial complete? Connect this button to your existing lobby route.');break;case'timeline-data':missingTimeline=!missingTimeline;render({focusAction:action});break;case'presentation':document.body.classList.toggle('presentation');b.textContent=document.body.classList.contains('presentation')?'Exit presentation layout':'Presentation layout';break;case'fullscreen':try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{toast('Fullscreen is unavailable. Presentation layout still works.')}break;case'winner':clearInterval(spectatorTimer);spectatorTimer=null;$('spectator-live').innerHTML=K.winner();break;case'connection':connection=connection==='live'?'stale':'live';render({focusAction:action});break;case'reset-race':spectatorRacers=K.samples.racers.map(p=>({...p}));raceElapsed=32.8;phase='live';render({focusAction:action});break;case'play-race':if(spectatorTimer){clearInterval(spectatorTimer);spectatorTimer=null;b.textContent='Resume sample race';break}if(phase==='finished'){toast('Reset the replay to race again.');break}connection='live';b.textContent='Pause sample race';spectatorTimer=setInterval(()=>{raceElapsed+=.25;spectatorRacers=spectatorRacers.map((p,i)=>({...p,progress:K.clamp(p.progress+.012-i*.0004)}));if(spectatorRacers.every(p=>p.progress===1)){phase='finished';clearInterval(spectatorTimer);spectatorTimer=null;b.textContent='Replay finished'}repaintBroadcast()},250);break;case'toggle-ghost-data':missingGhost=!missingGhost;isDrill=false;ghostPassage=K.samples.passage;render({focusAction:action});break;case'reset-ghost':resetGhost();if($('ghost-input')){$('ghost-input').readOnly=false;$('ghost-input').focus()}break;}});
window.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('presentation')});
window.addEventListener('hashchange',()=>render());window.addEventListener('beforeunload',()=>{stopLoops();clearTimeout(toastTimer)});
const viewport=window.visualViewport;let initialHeight=window.innerHeight;function keyboardLayout(){const active=['INPUT','TEXTAREA'].includes(document.activeElement?.tagName);document.body.classList.toggle('keyboard-open',window.innerWidth<760&&active&&!!viewport&&initialHeight-viewport.height>140)}viewport?.addEventListener('resize',keyboardLayout);window.addEventListener('orientationchange',()=>initialHeight=window.innerHeight);document.addEventListener('focusout',()=>setTimeout(keyboardLayout,0));
$('navigation').innerHTML=sections.map(([id,n,title,icon])=>`<a href="#${id}">${K.icon(icon)}<span>${title}</span></a>`).join('');render();

</script></body></html>
