full. Try another code.','error')}<div>${G.button('Show toast',{variant:'secondary',attrs:'data-toast="Selection saved. See you at the starting line."'})}</div></div>`)+section('Type and spacing',`<div class="g-panel"><div class="g-eyebrow">SMALL DETAILS. SHARED RULES.</div><h2 style="font-size:32px;margin:10px 0">Clear at a glance.</h2><p class="g-muted">12 / 14 / 16 / 20 / 28 px type. 4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 px spacing.</p><p class="g-mono">P07 · 98.4% · 112 WPM</p><p class="g-small g-muted">Corners: 8 / 14 / 22 px. Controls: minimum 44 px height.</p></div>`)}
function lobby(){return head('03 / WAITING ROOM','The crew is coming together.','Choose your ride. Share the code. We’ll meet you on the starting line.')+G.lobby({players:racers.slice(0,8),code:'GRID42',host:true})}
function garagePage(){return head('04 / VEHICLE GARAGE','Your ride. Your rules.','Original vehicle kit, integrated with the shared design system.')+`<div class="show-layout-wide"><div class="show-garage-grid">${VehicleKit.models.map((m,i)=>`<button class="show-car-card" data-car="${m.id}" aria-pressed="${garage.model===m.id}"><span class="g-eyebrow" style="font-size:8px">${String(i+1).padStart(2,'0')} / GRID</span>${VehicleKit.svg({model:m.id,primary:colors[i],number:i+1})}<strong>${m.name}</strong></button>`).join('')}</div><div class="g-stack"><div class="show-garage-preview"><h3 id="garage-name">${VehicleKit.models.find(m=>m.id===garage.model).name}</h3><div id="garage-art">${VehicleKit.svg(garage)}</div></div><div class="g-panel g-stack"><div class="g-grid-2"><label class="g-field">Body<input class="g-input" type="color" data-garage="primary" value="${garage.primary}"></label><label class="g-field">Accent<input class="g-input" type="color" data-garage="accent" value="${garage.accent}"></label></div><label class="g-field">Wheels<select class="g-select" data-garage="wheels">${['sport','aero','retro'].map(x=>`<option ${garage.wheels===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="g-field">Number<input class="g-input" type="number" min="0" max="99" data-garage="number" value="${garage.number}"></label><label class="g-switch"><input type="checkbox" data-garage="stripes" ${garage.stripes?'checked':''}>Racing stripes</label><label class="g-field">Effect<select class="g-select" data-garage="effect">${['none','smoke','trails','neon'].map(x=>`<option ${garage.effect===x?'selected':''}>${x}</option>`).join('')}</select></label>${G.button('Confirm ride',{attrs:'data-action="confirm-car"',icon:'check'})}</div></div></div>`}
function voting(){return head('05 / MODE VOTING','Pick your kind of fast.','One racer, one vote. Choose the challenge for the whole grid.')+`<div class="g-voting-head"><div><span class="g-pill g-pill--lime">LOCAL PREVIEW</span><p class="g-muted">Votes and timer in this showroom are simulated.</p></div><div id="vote-timer">${G.timerRing(15)}</div></div><div class="g-grid-3" id="mode-cards">${G.modes.map((m,i)=>G.modeCard(m,{count:[2,3,1,4,2,1][i],voters:racers.slice(i,i+2)})).join('')}</div><div class="show-demo-actions">${G.button('Run voting timer',{icon:'clock',attrs:'data-action="vote-timer"'})}${G.button('Preview tie-break',{variant:'secondary',attrs:'data-action="tie"'})}</div><div id="vote-reveal" class="g-panel" hidden></div>`}
function track(){const shown=G.visibleRacers(racers,'p6');return head('06 / TRACK & ENVIRONMENTS','Keep the finish in sight.','Four visible lanes, one authoritative progress scale. Optional scenery stays behind the action.')+`<div class="g-row" style="margin-bottom:18px"><label class="g-field">Backdrop<select id="scene" class="g-select">${['city','desert','neon','theatre','circuit'].map(m=>`<option>${m}</option>`).join('')}</select></label>${G.button('Animate progress',{variant:'secondary',icon:'arrow',attrs:'data-action="race-progress"'})}</div><div class="show-race-stack"><div>${G.hud()}</div><div id="track-preview">${G.track({racers:shown,localId:'p6'})}</div>${G.minimap(racers,'p6')}${G.typingPanel({index:18})}</div>`+section('Environment artwork',`<div class="show-mini-scenes">${['city','desert','neon','theatre','circuit'].map(id=>`<div class="show-asset">${G.environment(id)}<h3>${id[0].toUpperCase()+id.slice(1)}</h3></div>`).join('')}</div>`)}
function moments(){return head('07 / RACE MOMENTS','Make the moment count.','A synchronized start, clear celebrations, and restrained on-track feedback.')+`<div class="g-panel"><div id="countdown">${G.countdownFrame('READY')}</div><div class="g-row" style="justify-content:center">${G.button('Run 3 · 2 · 1 · GO',{icon:'flag',attrs:'data-action="countdown"'})}</div></div>`+section('Race announcements',`<div class="g-grid-2">${G.moment('finish')}${G.moment('leader',{name:'Yaseen'})}${G.moment('gain',{gain:2})}${G.moment('photo')}</div>`)+section('Photo finish · illustration',`<div class="g-photo-stage">${VehicleKit.svg({model:'formula',primary:'#8dbdff'})}${VehicleKit.svg({model:'classic',primary:'#ff683b'})}</div><p class="show-note">Never infer a winner from visual overlap. Show the server’s official completion order.</p>`)}
function hud(){return head('08 / RACE HUD','The numbers that matter.','Readable status without taking attention away from the passage.')+G.hud()+section('All 15 position badges',`<div class="g-panel g-row">${Array.from({length:15},(_,i)=>G.positionBadge(i+1)).join('')}</div>`)+section('The whole field',G.minimap(racers,'p6'))+section('Spectating state',G.spectating('Alex'))+section('Compact layout',`<div class="show-phone"><div class="g-eyebrow">MOBILE HUD</div><h3>Your race, at a glance.</h3>${G.hud({position:7,wpm:84,accuracy:98.4,mistakes:3})}<p class="g-small g-muted">Keep stats compact. Keep passage text readable.</p></div>`)}
function typing(){return head('09 / TYPING PANEL','Let the words lead.','Three presentation styles. The same clear character states.')+`<div class="g-row" id="typing-modes" style="margin-bottom:20px">${['standard','coding','shakespeare'].map((m,i)=>`<button class="g-filter" data-type-mode="${m}" aria-pressed="${i===0}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div><div id="live-typing">${G.typingPanel()}</div><p class="show-note" id="typing-stats">Local typing demo · no network or official score.</p><div class="show-demo-actions">${G.button('Reset passage',{variant:'secondary',icon:'refresh',attrs:'data-action="reset-typing"'})}</div>`+section('Waiting for GO',G.typingPanel({state:'waiting'}))+section('Incorrect character',G.typingPanel({index:12,error:true,state:'error'}))+section('Finished',G.typingPanel({index:999,state:'finished'}))}
function results(){const list=racers.slice(0,10).map(p=>({...p}));list[8]={...list[8],status:'dnf',time:null,wpm:null,accuracy:null,mistakes:null};list[9]={...list[9],status:'flagged',time:null};return head('10 / RESULTS','Every finish has a story.','Illustrative results. Official timing and awards must come from your server.',G.button('Celebrate',{variant:'secondary',attrs:'data-action="confetti"'}))+`<div class="g-panel" style="position:relative;overflow:hidden" id="podium-stage">${G.podium(racers)}</div>`+section('Your awards',G.earnedTrophies({name:'Yaseen',awards:[{trophyId:'comeback-kid',recipient:'Yaseen',statistic:'+7 positions · 14th → 7th'},{trophyId:'consistency',recipient:'Yaseen',statistic:'4.8% WPM variation'}],progression:[{trophyId:'unstoppable',recipient:'Yaseen',statistic:'3 consecutive completions'}]}))+section('Official standings · example data',G.resultRows(list))+G.resultActions()}
function trophies(){return head('11 / TROPHY COLLECTION','More than first place.','The original twenty trophies, with shared card styling and three visual states.')+`<div class="g-row" style="margin-bottom:20px"><label class="g-field">Display state<select id="trophy-state" class="g-select"><option>earned</option><option>locked</option><option>reveal</option></select></label></div><div class="show-trophy-grid" id="trophy-grid">${TrophyKit.catalog.map(t=>`<div class="show-trophy-card">${TrophyKit.renderTrophy(t.id)}<h3>${E(t.name)}</h3><small>${t.category} · ${t.scope}</small></div>`).join('')}</div>`}
function system(){return head('12 / SYSTEM STATES','A little help at every turn.','Calm, specific feedback. Clear next steps. Original SVG illustrations.')+`<div class="g-system-grid">${G.systemStates.map(s=>`<div class="g-panel">${G.systemState(s.id)}</div>`).join('')}</div>`}
function soundPage(){return head('13 / SOUND STUDIO','Sound that stays in its lane.','Ten original synthesized cues. Muted by default, with a master volume and a voice limit.')+`<div class="g-panel g-row"><label class="g-switch"><input id="enable-sound" type="checkbox" ${!sound.muted?'checked':''}>Enable sound</label><label class="g-field">Master volume<input id="sound-volume" type="range" min="0" max="1" step=".05" value="${sound.volume}" aria-label="Master volume"></label><span class="g-muted g-small">Click Play to preview a cue. Audio starts only after your interaction.</span></div><div class="g-grid-2 show-section">${Object.entries(G.soundRecipes).map(([id,r],i)=>`<div class="show-sound-row"><div><h3>${r.label}</h3><p>${id}.wav</p></div><div class="show-waveform" aria-hidden="true">${Array.from({length:16},(_,j)=>`<i style="height:${6+Math.abs(Math.sin(j*1.1+i))*25}px"></i>`).join('')}</div>${G.button('Play',{variant:'secondary',icon:'sound',attrs:`data-sound="${id}"`})}</div>`).join('')}</div>`+section('Mute controls',`<div class="g-row">${G.button('Sound on',{variant:'secondary',icon:'sound',attrs:'data-action="sound-on"'})}${G.button('Muted',{variant:'secondary',icon:'mute',attrs:'data-action="sound-off"'})}</div>`)}
function motion(){return head('14 / MOTION SPEC','Fast, clear, consistent.','Shared timing and easing, plus a reusable keyed-lane FLIP helper.')+`<div class="g-panel"><table class="show-table"><thead><tr><th>Moment</th><th>Duration</th><th>Behaviour</th></tr></thead><tbody>${[['Hover','120 ms','Colour and border only'],['Screen entry','220 ms','Opacity / small translation'],['Lane swap','260 ms','Keyed FLIP, stable player identity'],['Progress','180 ms','Linear snapshot interpolation'],['Mistake','300 ms','Small chassis shake'],['Overtake','650 ms','One brief visual cue'],['Trophy reveal','650 ms','One-time scale and fade'],['Tie reveal','700 ms','Decorative rotation only'],['Confetti','1700 ms','28 bounded particles'],['Toast','4000 ms','Nonblocking status']].map(row=>`<tr>${row.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`+section('Lane swap preview',`<div class="g-stack" id="motion-lanes">${racers.slice(0,3).map(p=>`<div data-player-id="${p.id}">${G.playerCard(p)}</div>`).join('')}</div><div class="show-demo-actions">${G.button('Swap positions',{variant:'secondary',attrs:'data-action="swap"'})}</div>`)+G.banner('Reduced motion: final states appear immediately; no shake, spin, confetti, or smooth scrolling.','info')}
const pages={overview,brand,ui,lobby,garage:garagePage,voting,track,moments,hud,typing,results,trophies,system,sound:soundPage,motion};
function render(){cleanup.forEach(fn=>fn());cleanup=[];current=location.hash.slice(1);if(!pages[current])current='overview';$('content').innerHTML=pages[current]()+`<footer class="show-footer">GRID DESIGN COLLECTION / v1.0 · Local preview · Example data · No server connection</footer>`;document.querySelectorAll('.show-nav a').forEach(a=>{if(a.hash==='#'+current)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.title='GRID / '+chapters.find(c=>c[0]===current)[2];if(current==='typing')initTyping('standard');if(current==='track')cleanup.push(G.attachTypingDemo($('content').querySelector('.g-typing')));window.scrollTo({top:0,behavior:'instant'});}
let typeMode='standard';let disposeTyping;function initTyping(mode){disposeTyping?.();typeMode=mode;const host=$('live-typing');if(!host)return;host.innerHTML=G.typingPanel({mode});disposeTyping=G.attachTypingDemo(host,{passage:G.passages[mode],onProgress:s=>{$('typing-stats').textContent=`Local demo · ${Math.round(s.progress*100)}% complete · ${s.accuracy.toFixed(1)}% accuracy · ${s.mistakes} mistakes`;}});cleanup.push(disposeTyping);}
function refreshGarage(){garage=VehicleKit.normalize(garage);$('garage-art').innerHTML=VehicleKit.svg({...garage,animation:'driving'});$('garage-name').textContent=VehicleKit.models.find(m=>m.id===garage.model).name;document.querySelectorAll('[data-car]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.car===garage.model)));}
let vote='';let cancelVote;function drawVotes(){if(!$('mode-cards'))return;$('mode-cards').innerHTML=G.modes.map((m,i)=>G.modeCard(m,{count:[2,3,1,4,2,1][i]+(vote===m.id?1:0),selected:vote===m.id,voters:racers.slice(i,i+2)})).join('');}
document.addEventListener('click',async event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.go){location.hash=b.dataset.go;return}if(b.dataset.toast)G.toast(b.dataset.toast,'success');if(b.closest('#pill-demo'))b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));if(b.dataset.car){garage.model=b.dataset.car;refreshGarage()}if(b.dataset.mode){vote=b.dataset.mode;drawVotes()}if(b.dataset.typeMode){document.querySelectorAll('[data-type-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));initTyping(b.dataset.typeMode)}if(b.dataset.systemAction)G.toast('Demo action: '+G.systemStates.find(s=>s.id===b.dataset.systemAction).action);if(b.dataset.sound){sound.setMuted(false);if($('enable-sound'))$('enable-sound').checked=true;try{await sound.play(b.dataset.sound)}catch{G.toast('Audio is not available in this browser.','warning')}}switch(b.dataset.action){
case'copy-code':await G.copy('GRID42');break;
case'copy-invite':G.toast('Preview only: no live lobby invitation exists. Use your server-generated URL.','info');break;
case'garage':location.hash='garage';break;
case'start-vote':case'new-vote':location.hash='voting';break;
case'back-lobby':location.hash='lobby';break;
case'rematch':location.hash='moments';break;
case'confirm-car':racers[6].vehicle={...garage};G.toast('Ride confirmed for this local preview.','success');break;
case'vote-timer':{cancelVote?.();let finished=false;cancelVote=G.watchDeadline(Date.now()+15000,s=>{if(!$('vote-timer'))return;$('vote-timer').innerHTML=G.timerRing(s);if(s<=0&&!finished){finished=true;cancelVote?.();$('vote-reveal').hidden=false;$('vote-reveal').innerHTML=G.voteReveal(vote&&vote!=='random'?vote:'coding');}});cleanup.push(cancelVote);break;}
case'tie':{$('vote-reveal').hidden=false;$('vote-reveal').innerHTML=G.dice(true);later(()=>{if($('vote-reveal'))$('vote-reveal').innerHTML=G.voteReveal('coding',{tie:true})},720);break;}
case'countdown':{b.disabled=true;const cancel=G.countdown($('countdown'),{deadline:Date.now()+3000,onGo:()=>{b.disabled=false;sound.play('go-horn').catch(()=>{})}});cleanup.push(cancel);break;}
case'race-progress':{b.disabled=true;const start=performance.now();let frame;const shown=G.visibleRacers(racers,'p6');const animate=now=>{if(!$('track-preview'))return;const t=Math.min(1,(now-start)/3500);G.updateTrack($('track-preview'),shown.map(p=>({...p,progress:p.progress+(1-p.progress)*t})));if(t<1)frame=requestAnimationFrame(animate);else b.disabled=false};frame=requestAnimationFrame(animate);cleanup.push(()=>cancelAnimationFrame(frame));break;}
case'reset-typing':initTyping(typeMode);break;
case'confetti':cleanup.push(G.confetti($('podium-stage')));break;
case'sound-on':sound.setMuted(false);if($('enable-sound'))$('enable-sound').checked=true;G.toast('Sound enabled.','success');break;
case'sound-off':sound.setMuted(true);if($('enable-sound'))$('enable-sound').checked=false;G.toast('Sound muted.');break;
case'swap':{const root=$('motion-lanes'),before=G.captureLanes(root);root.prepend(root.lastElementChild);cleanup.push(G.animateLanes(root,before));break;}
}});
document.addEventListener('input',event=>{const el=event.target;if(el.dataset.garage){garage[el.dataset.garage]=el.type==='checkbox'?el.checked:el.value;refreshGarage()}if(el.id==='sound-volume')sound.setVolume(el.value)});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='scene')$('track-preview').innerHTML=G.track({racers:G.visibleRacers(racers,'p6'),localId:'p6',scene:el.value});if(el.id==='enable-sound')sound.setMuted(!el.checked);if(el.id==='trophy-state')$('trophy-grid').innerHTML=TrophyKit.catalog.map(t=>`<div class="show-trophy-card">${TrophyKit.renderTrophy(t.id,{state:el.value})}<h3>${E(t.name)}</h3><small>${t.category} · ${t.scope}</small></div>`).join('')});
document.addEventListener('keydown',G.escapeTooltip);document.addEventListener('focusin',e=>e.target.closest('.g-tip-wrap')?.classList.remove('dismissed'));document.addEventListener('pointerover',e=>e.target.closest('.g-tip-wrap')?.classList.remove('dismissed'));
$('brand').innerHTML=G.wordmark();$('navigation').innerHTML=chapters.map(([id,n,title])=>`<a href="#${id}"><span>${n}</span>${title}</a>`).join('');window.addEventListener('hashchange',render);window.addEventListener('beforeunload',()=>{cleanup.forEach(fn=>fn());sound.destroy()});render();

</script></body></html>
