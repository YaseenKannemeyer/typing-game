function render(){cleanup.forEach(fn=>fn());cleanup=[];control?.destroy();control=null;let id=location.hash.slice(1)||'overview';if(!pages[id])id='overview';$('content').innerHTML=pages[id]()+footer();document.querySelectorAll('.w-nav a').forEach(a=>{if(a.hash==='#'+id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});if(id==='control')control=new W.RaceControl($('control-live'));document.title='GRID / '+sections.find(s=>s[0]===id)[2];window.scrollTo({top:0,behavior:'instant'});}
function redrawVehicle(){if($('workshop-scene'))$('workshop-scene').innerHTML=W.workshop({vehicle,station});if($('livery-scene'))$('livery-scene').innerHTML=W.workshop({vehicle,station:'livery'});if($('driver-card'))$('driver-card').innerHTML=driverCard();document.querySelectorAll('[data-paint]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.paint===vehicle.primary)));document.querySelectorAll('[data-team]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.team===vehicle.team)));}
document.addEventListener('input',e=>{if(e.target.dataset.vehicle){const key=e.target.dataset.vehicle;vehicle[key]=e.target.type==='checkbox'?e.target.checked:e.target.type==='number'?Math.round(W.clamp(e.target.value,0,99)):e.target.value;redrawVehicle()}if(e.target.id==='wpm-range'){wpm=Number(e.target.value);$('dashboard-live').innerHTML=W.dashboard({wpm})}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){location.hash=b.dataset.go;return}if(b.dataset.station){station=b.dataset.station;document.querySelectorAll('[data-station]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));redrawVehicle()}if(b.dataset.paint){vehicle.primary=b.dataset.paint;const field=document.querySelector('[data-vehicle="primary"]');if(field)field.value=vehicle.primary;redrawVehicle()}if(b.dataset.team){vehicle.team=b.dataset.team;redrawVehicle()}if(b.dataset.destination){destination=b.dataset.destination;document.querySelectorAll('[data-destination]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('destination-preview').innerHTML=W.destinationScene(destination)}if(b.dataset.control){control?.show({id:'event-'+ ++eventCount,type:b.dataset.control});sounds.play(b.dataset.control==='finish'?'finish':'ui-click').catch(()=>{})}if(b.dataset.trophy){$('trophy-detail').innerHTML=W.trophyDetails(b.dataset.trophy,earned);$('trophy-dialog').showModal()}switch(b.dataset.action){case'confirm-build':G.toast('Build confirmed in this preview. Connect to your lobby API to save it.','success');break;case'copy-room':await G.copy('GRID42');break;case'vote':G.toast('Host action preview. Connect this to your existing mode-voting phase.');break;case'ready':ready=!ready;render();break;case'join':joined=Math.min(15,joined+1);render();break;case'finish-sound':sounds.setMuted(false);try{await sounds.play('finish');$('sound-toggle').textContent='Mute sound'}catch{G.toast('Audio is unavailable in this browser.','warning')}break;case'toggle-sound':sounds.setMuted(!sounds.muted);b.textContent=sounds.muted?'Enable sound':'Mute sound';break;case'close-trophy':$('trophy-dialog').close();break;case'next-round':completed=Math.min(3,completed+1);render();break;case'reset-event':completed=0;render();break;case'race':{b.disabled=true;const start=performance.now(),racers=W.visible(W.samplePlayers,'p6');let frame;const tick=now=>{const t=W.clamp((now-start)/5000);W.updateCircuit($('circuit-live'),racers.map(p=>({...p,progress:p.progress+(1-p.progress)*t})));if(t<1)frame=requestAnimationFrame(tick);else b.disabled=false};frame=requestAnimationFrame(tick);cleanup.push(()=>cancelAnimationFrame(frame));break;}}});
$('navigation').innerHTML=sections.map(([id,n,title])=>`<a href="#${id}"><small>${n}</small>${title}</a>`).join('');window.addEventListener('hashchange',render);window.addEventListener('beforeunload',()=>{cleanup.forEach(fn=>fn());control?.destroy();sounds.destroy()});render();

</script></body></html>
