# Keeps the free Supabase project from pausing after a week without traffic by
# calling a harmless public function every 3 days. Uses only the publishable
# key, which is public anyway (it ships in the website).
# Note: GitHub disables scheduled workflows after 60 days with no commits;
# re-enable it from the Actions tab if that happens.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the database through the public API
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://hhpxvihwkhtehcbugxft.supabase.co' }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_OKNoo-QnMnxsRn_0OSFRWA_WdW1ypmc' }}
        run: |
          status=$(curl -s -o response.txt -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/server_now" \
            -H "apikey: $SUPABASE_KEY" -H 'Content-Type: application/json' -d '{}')
          echo "HTTP $status: $(cat response.txt)"
          test "$status" = 200
